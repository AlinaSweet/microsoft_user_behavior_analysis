name: Quality
on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if [ ! -f "$(brew --prefix libomp)/lib/libomp.dylib" ]; then
            brew install libomp
          fi
      - name: Install locked runtime and quality tools
        run: python -m pip install --no-deps -r requirements-dev.txt
      - name: Verify the clean checkout
        run: python scripts/reproduce.py verify
