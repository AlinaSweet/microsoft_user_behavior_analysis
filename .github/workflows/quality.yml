name: Quality
on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked runtime and quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Verify the clean checkout
        run: python scripts/reproduce.py verify
