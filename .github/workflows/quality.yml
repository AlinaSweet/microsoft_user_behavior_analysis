name: Quality
on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked runtime and quality tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check standards, style, types, quality and tests
        run: bash scripts/check_quality.sh --force
