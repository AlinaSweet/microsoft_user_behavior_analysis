distributed:
  worker:
    memory:
      target: 0.60
      spill: 0.70
      pause: 0.80
      terminate: 0.95

# Conservative local starting point for this 469 MiB CSV and the current machine
# (16 GiB total RAM, about 3 GiB available at setup time). Recheck available RAM
# before a full run and adjust if other applications are using more memory.
local_cluster:
  n_workers: 2
  threads_per_worker: 1
  memory_limit: 1GiB
  csv_blocksize: 64MiB
